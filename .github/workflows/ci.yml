name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chore/scaffold]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Prove SQLite artifacts stay ignored
        shell: bash
        run: |
          touch acceptance-proof.sqlite
          git check-ignore -v acceptance-proof.sqlite
          rm acceptance-proof.sqlite
