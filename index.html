<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Drop a pin and discover the historical events closest to that place. No account, no tracking, and your coordinate is never stored."
    />
    <!-- Origin only, never the path. A blanket no-referrer here got every OSM
         tile refused with 403: their usage policy requires an identifiable
         client, and an anonymous request cannot be one. Sending the origin
         costs no privacy, because no coordinate is ever in a URL -- the
         coordinate goes in a POST body, and the request that carries it sets
         referrerPolicy: 'no-referrer' at its own call site in src/api.ts. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Locus — what happened near here?</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
         The .ico covers the 16/32/48 sizes browsers still ask for by name and
         the surfaces that ignore SVG entirely. Both it and favicon.svg carry
         the drawn pin rather than the emblem: the logo has a castle, a temple,
         a factory and a plaza in it, and at 16px that resolves to grey mush.
         Everything 128px and up uses the real artwork.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#104d9d" />
    <link rel="canonical" href="https://www.locustimeline.org/" />
    <!--
         Absolute og:url and og:image, because scrapers do not resolve relative
         URLs. www is canonical and the apex redirects to it, so naming the
         apex here would cost every crawler a redirect hop.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Locus" />
    <meta property="og:url" content="https://www.locustimeline.org/" />
    <meta property="og:title" content="Locus — what happened near here?" />
    <meta property="og:description" content="Drop a pin and discover the historical events closest to that place. No account, no tracking, and your coordinate is never stored." />
    <meta property="og:image" content="https://www.locustimeline.org/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Locus mark beside the word Locus and the question: what happened near here?" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Both stylesheets are served from public/ verbatim, which is what lets
         the hand-written pages in public/why, public/how-it-works,
         public/resources, public/faq and public/privacy share this palette and
         this footer with the applet. src/style.css holds only app rules and is
         injected by Vite after these, so it wins where the two overlap. -->
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <main id="app"></main>
    <!-- The written pages' footer, minus the "Locus App" link: this page IS
         the app, and a link to the page you are already on is noise. The link
         list is duplicated in each static page's markup; test/pages.test.ts is
         what keeps the copies from disagreeing. -->
    <footer class="site-footer site-footer--app">
      <div class="inner">
        <a href="/why">Why this exists</a>
        <a href="/how-it-works">How this works</a>
        <a href="/resources">Resources</a>
        <a href="/faq">FAQ</a>
        <a href="/privacy">Privacy</a>
        <span class="spacer"></span>
        <a class="sibling" href="https://www.circatimeline.org" rel="noopener">Circa ↗</a>
        <a class="who" href="https://www.linkedin.com/in/noffsingercb/" rel="noopener">
          By Ben Noffsinger
        </a>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
